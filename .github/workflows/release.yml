name: Release APK

# Minden pushra: ha az app verziója (versionName) új taget ér,
# aláírt release-APK-t buildel és GitHub Release-t csinál.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "v$V" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.ver.outputs.exists == 'false'

      - name: Install SDK packages
        if: steps.ver.outputs.exists == 'false'
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        if: steps.ver.outputs.exists == 'false'
        run: |
          curl -sL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.5.1-bin.zip"
          unzip -qo /tmp/gradle.zip -d "$HOME/opt"
          echo "$HOME/opt/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Neutralize Termux-only gradle.properties
        if: steps.ver.outputs.exists == 'false'
        run: |
          sed -i '/proxyHost\|proxyPort\|hosts\.file\|aapt2FromMavenOverride/d' gradle.properties
          cat gradle.properties

      - name: Restore release keystore from secrets
        if: steps.ver.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error:: RELEASE_KEYSTORE_B64 secret hiányzik"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed release APK
        if: steps.ver.outputs.exists == 'false'
        run: gradle assembleRelease --no-daemon

      - name: Tag and publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.name }}"
          gh release create "v$V" \
            app/build/outputs/apk/release/app-release.apk \
            --title "v$V" --generate-notes
